services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aigc_shelf}
      POSTGRES_USER: ${POSTGRES_USER:-aigc_shelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - aigc_shelf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [aigc_shelf_net]

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aigc_shelf}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aigc_shelf}
      PORT: 18080
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:18080"
    networks: [aigc_shelf_net]

volumes:
  aigc_shelf_pgdata:
    name: aigc_shelf_pgdata

networks:
  aigc_shelf_net:
    name: aigc_shelf_net
